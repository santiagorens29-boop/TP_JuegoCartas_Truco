<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor de Juegos de Cartas - V2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body style="background-color: #1e272e; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; padding: 20px;">

    <h1>♠️ Motor de Juegos de Cartas ♦️</h1>
    <div id="estado-conexion" style="background-color: #3d3d3d; padding: 5px; display: inline-block; border-radius: 5px; margin-bottom: 20px;">
        Conectando al servidor central...
    </div>

    <div id="pantalla-lobby" style="max-width: 400px; margin: 0 auto; background-color: #2f3640; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
        
        <h3>Configuración de la Mesa</h3>
        <input type="text" id="codigo-sala" placeholder="Código de Sala (Ej: TRUCO77)" style="width: 90%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: none; text-transform: uppercase;"><br>

        <label for="select-jugadores">Cantidad de Jugadores:</label>
        <select id="select-jugadores" style="width: 95%; padding: 10px; margin-bottom: 20px; border-radius: 5px; background: #fff; color: #000;">
            <option value="2">2 Jugadores (1 vs 1)</option>
            <option value="4">4 Jugadores (2 vs 2 - Equipos)</option>
            <option value="6">6 Jugadores (3 vs 3 - Equipos)</option>
        </select>

        <button onclick="crearMesa()" style="width: 100%; padding: 12px; background-color: #4cd137; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-bottom: 10px;">
            Crear Nueva Partida
        </button>
        
        <button onclick="unirseAMesa()" style="width: 100%; padding: 12px; background-color: #00a8ff; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">
            Unirse como Jugador / Espectador
        </button>
    </div>

    <div id="pantalla-juego" style="display: none; max-width: 800px; margin: 0 auto; background-color: #0c5c36; border: 8px solid #8c52ff; border-radius: 15px; padding: 20px; min-height: 430px; box-shadow: inset 0 0 50px rgba(0,0,0,0.8);">
        
        <h2 style="color: #fbc531;">Mesa de Juego Activa</h2>
        <div id="info-sala" style="font-weight: bold; margin-bottom: 10px;"></div>
        <div id="mi-rol" style="color: #00a8ff; font-weight: bold; margin-bottom: 20px;"></div>

        <div style="background-color: #0a4b2c; border: 2px dashed #fff; border-radius: 10px; min-height: 240px; margin: 20px 0; display: grid; grid-template-columns: repeat(3, 1fr); padding: 15px; gap: 15px; position: relative;">
            
            <p id="texto-espera" style="color: #a4b0be; font-style: italic; position: absolute; width: 100%; top: 40%; margin: 0; left: 0; pointer-events: none;">
                Esperando que los jugadores tiren sus cartas...
            </p>

            <div id="ronda-1" style="display: flex; flex-direction: column-reverse; align-items: center; gap: 15px; justify-content: flex-end; border-right: 1px dashed rgba(255,255,255,0.2); padding-right: 5px;"></div>
            
            <div id="ronda-2" style="display: flex; flex-direction: column-reverse; align-items: center; gap: 15px; justify-content: flex-end; border-right: 1px dashed rgba(255,255,255,0.2); padding-right: 5px;"></div>
            
            <div id="ronda-3" style="display: flex; flex-direction: column-reverse; align-items: center; gap: 15px; justify-content: flex-end;"></div>
        </div>

        <div style="background-color: #2f3640; padding: 15px; border-radius: 10px;">
            <div id="botonera-envido" style="margin-bottom: 15px; display: none; justify-content: center; gap: 10px;">
                <button onclick="cantarTantos('envido')" style="padding: 10px 15px; background-color: #fbc531; color: black; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">
                    📢 Envido
                </button>
                <button onclick="cantarTantos('real_envido')" style="padding: 10px 15px; background-color: #e67e22; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">
                    🔥 Real Envido
                </button>
                <button onclick="cantarTantos('falta_envido')" style="padding: 10px 15px; background-color: #e74c3c; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">
                    🚨 Falta Envido
                </button>
            </div>

            <!-- Panel visual de respuestas para el rival ante apuestas de tantos -->
            <div id="botonera-respuesta-envido" style="margin-bottom: 15px; display: none; justify-content: center; gap: 10px; background-color: #1e272e; padding: 10px; border-radius: 8px; border: 2px solid #8c52ff;">
                <button onclick="responderTantos('quiero')" style="padding: 10px 15px; background-color: #4cd137; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">
                    🟢 Quiero
                </button>
                <button onclick="responderTantos('no_quiero')" style="padding: 10px 15px; background-color: #e74c3c; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">
                    🔴 No Quiero
                </button>
                <button id="btn-revire-envido" onclick="responderTantos('envido')" style="padding: 10px 15px; background-color: #fbc531; color: black; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">
                    🔄 Envido
                </button>
                <button id="btn-revire-real" onclick="responderTantos('real_envido')" style="padding: 10px 15px; background-color: #e67e22; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">
                    🔥 Real Envido
                </button>
                <button id="btn-revire-falta" onclick="responderTantos('falta_envido')" style="padding: 10px 15px; background-color: #e74c3c; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">
                    🚨 Falta Envido
                </button>
            </div>

            <!-- Interfaz secuencial de Declaración de tantos individuales -->
            <div id="botonera-anuncio-tanto" style="margin-bottom: 15px; display: none; justify-content: center; gap: 10px; background-color: #2c3a47; padding: 12px; border-radius: 8px; border: 2px solid #fbc531;">
                <span id="label-tanto-calculado" style="font-weight: bold; align-self: center; margin-right: 5px; color: #fbc531;"></span>
                <button id="btn-anunciar-numero" onclick="enviarDeclaracion('decir_tanto')" style="padding: 10px 15px; background-color: #2ed573; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">
                    💬 Anunciar Tanto
                </button>
                <button id="btn-son-buenas" onclick="enviarDeclaracion('son_buenas')" style="padding: 10px 15px; background-color: #718093; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">
                    ⚪ Son Buenas
                </button>
            </div>

            <!-- Panel de acciones ofensivas de cartas -->
            <div id="botonera-truco-ofensiva" style="margin-bottom: 15px; display: none; justify-content: center; gap: 10px; background-color: #1e272e; padding: 8px; border-radius: 8px; border: 1px dashed #fff;">
                <button id="btn-gritar-truco" onclick="gritarTruco('truco')" style="padding: 10px 15px; background-color: #8c52ff; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">
                    🃏 Truco
                </button>
                <button id="btn-gritar-retruco" onclick="gritarTruco('retruco')" style="padding: 10px 15px; background-color: #9c27b0; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; display: none;">
                    🔄 Retruco
                </button>
                <button id="btn-gritar-vale4" onclick="gritarTruco('vale_4')" style="padding: 10px 15px; background-color: #e91e63; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; display: none;">
                    🔥 Vale 4
                </button>
            </div>

            <!-- Panel de respuestas de Truco -->
            <div id="botonera-respuesta-truco" style="margin-bottom: 15px; display: none; justify-content: center; gap: 10px; background-color: #2f3640; padding: 12px; border-radius: 8px; border: 2px solid #8c52ff;">
                <button onclick="responderTruco('quiero')" style="padding: 10px 15px; background-color: #4cd137; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">
                    👍 Quiero
                </button>
                <button onclick="responderTruco('no_quiero')" style="padding: 10px 15px; background-color: #e74c3c; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">
                    👎 No Quiero
                </button>
                <button id="btn-responder-retruco" onclick="gritarTruco('retruco')" style="padding: 10px 15px; background-color: #9c27b0; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; display: none;">
                    🔄 Retruco
                </button>
                <button id="btn-responder-vale4" onclick="gritarTruco('vale_4')" style="padding: 10px 15px; background-color: #e91e63; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; display: none;">
                    🔥 Vale 4
                </button>
                <button id="btn-envido-primero" onclick="responderTruco('envido_primero')" style="padding: 10px 15px; background-color: #fbc531; color: black; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; display: none;">
                    📢 Envido Primero
                </button>
            </div>

            <h4>Tus Cartas en Mano:</h4>
            <div id="mis-cartas-container" style="display: flex; justify-content: center; gap: 15px;">
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        
        let miTantoLocalCalculado = 0;

        socket.on('connect', () => {
            const estado = document.getElementById('estado-conexion');
            estado.innerText = "Conectado al Servidor Central (Intranet)";
            estado.style.backgroundColor = "#4cd137";
        });

        function crearMesa() {
            const codigo = document.getElementById('codigo-sala').value;
            const maxJugadores = document.getElementById('select-jugadores').value;
            if(!codigo) { alert("Ingresá un código de sala."); return; }
            socket.emit('crear_sala', { codigo: codigo, max_jugadores: maxJugadores });
        }

        function unirseAMesa() {
            const codigo = document.getElementById('codigo-sala').value;
            if(!codigo) { alert("Ingresá un código de sala."); return; }
            socket.emit('unirse_sala', { codigo: codigo });
        }

        socket.on('sala_creada', (data) => {
            alert(data.mensaje);
            abrirMesaDeJuego(data.rol);
        });

        socket.on('rol_asignado', (data) => {
            abrirMesaDeJuego(data.rol);
            if(data.mensaje) { alert(data.mensaje); }
        });

        socket.on('partida_lista', (data) => {
            alert(data.mensaje);
            document.getElementById('texto-espera').innerText = "¡La partida comenzó! Turno del Jugador 1...";
            const miRolActual = document.getElementById('mi-rol').innerText;
            if(!miRolActual.includes("Espectador")) {
                document.getElementById('botonera-truco-ofensiva').style.display = 'flex';
                document.getElementById('btn-gritar-truco').style.display = 'inline-block';
            }
        });

        socket.on('error', (data) => {
            alert(data.mensaje);
        });

        function abrirMesaDeJuego(rolAsignado) {
            const codigo = document.getElementById('codigo-sala').value.toUpperCase();
            document.getElementById('pantalla-lobby').style.display = 'none';
            document.getElementById('pantalla-juego').style.display = 'block';
            document.getElementById('info-sala').innerText = `SALA: ${codigo}`;
            document.getElementById('mi-rol').innerText = `Tu Rol actual: ${rolAsignado}`;
        }

        socket.on('recibir_cartas', (data) => {
            const contenedor = document.getElementById('mis-cartas-container');
            contenedor.innerHTML = ""; 

            const miRolActual = document.getElementById('mi-rol').innerText; 
            const totalJugadores = parseInt(data.total_jugadores);
            const miNumeroJugador = parseInt(miRolActual.replace("Tu Rol actual: Jugador ", ""));

            let puedeCantar = false;
            if (totalJugadores === 2) {
                puedeCantar = true;
            } else if (totalJugadores === 4) {
                if (miNumeroJugador === 3 || miNumeroJugador === 4) puedeCantar = true;
            } else if (totalJugadores === 6) {
                if (miNumeroJugador === 5 || miNumeroJugador === 6) puedeCantar = true;
            }

            if (puedeCantar) {
                document.getElementById('botonera-envido').style.display = 'flex';
            } else {
                document.getElementById('botonera-envido').style.display = 'none';
            }

            let cartasMapeadas = data.cartas.map(c => {
                let v = parseInt(c.numero);
                return { valor: v >= 10 ? 0 : v, palo: c.palo };
            });
            let palos = {};
            cartasMapeadas.forEach(c => {
                if(!palos[c.palo]) palos[c.palo] = [];
                palos[c.palo].push(c.valor);
            });
            let maxLocal = 0;
            Object.keys(palos).forEach(p => {
                if(palos[p].length === 2) {
                    let t = 20 + palos[p][0] + palos[p][1];
                    if(t > maxLocal) maxLocal = t;
                } else if(palos[p].length === 3) {
                    palos[p].sort((a,b) => b-a);
                    let t = 20 + palos[p][0] + palos[p][1];
                    if(t > maxLocal) maxLocal = t;
                }
            });
            cartasMapeadas.forEach(c => { if(c.valor > maxLocal) maxLocal = c.valor; });
            
            miTantoLocalCalculado = maxLocal;

            data.cartas.forEach((carta, indice) => {
                const imagenCarta = document.createElement('img');
                imagenCarta.src = `static/cartas/${carta.numero}_${carta.palo}.png`;
                imagenCarta.id = `carta-${indice}`;
                
                imagenCarta.style.width = "100px";
                imagenCarta.style.height = "auto";
                imagenCarta.style.borderRadius = "8px";
                imagenCarta.style.cursor = "pointer";
                imagenCarta.style.boxShadow = "0 6px 10px rgba(0,0,0,0.4)";
                imagenCarta.style.transition = "transform 0.2s";

                imagenCarta.onmouseover = () => { imagenCarta.style.transform = "scale(1.08)"; };
                imagenCarta.onmouseout = () => { imagenCarta.style.transform = "scale(1)"; };

                imagenCarta.onclick = () => {
                    const codigo = document.getElementById('codigo-sala').value.toUpperCase();
                    socket.emit('tirar_carta', {
                        codigo: codigo,
                        carta: carta
                    });
                };
                contenedor.appendChild(imagenCarta);
            });
        });

        socket.on('carta_jugada', (data) => {
            const miRolActual = document.getElementById('mi-rol').innerText;
            if (data.ronda === 1 && miRolActual.includes(data.rol)) {
                document.getElementById('botonera-envido').style.display = 'none';
            }
            
            if (data.ronda > 1) {
                document.getElementById('botonera-envido').style.display = 'none';
            }

            const textoEspera = document.getElementById('texto-espera');
            if (textoEspera) { textoEspera.style.display = "none"; }
            
            const columnaRonda = document.getElementById(`ronda-${data.ronda}`);
            if (!columnaRonda) return;

            const bloqueCarta = document.createElement('div');
            bloqueCarta.style.display = "flex";
            bloqueCarta.style.flexDirection = "column";
            bloqueCarta.style.alignItems = "center";
            bloqueCarta.style.gap = "3px";

            const etiquetaRol = document.createElement('p');
            etiquetaRol.innerText = data.rol;
            etiquetaRol.style.margin = "0";
            etiquetaRol.style.fontSize = "12px";
            etiquetaRol.style.fontWeight = "bold";
            etiquetaRol.style.color = "#fbc531";

            const imgNaipe = document.createElement('img');
            imgNaipe.src = `static/cartas/${data.carta.numero}_${data.carta.palo}.png`;
            imgNaipe.style.width = "75px";
            imgNaipe.style.height = "auto";
            imgNaipe.style.borderRadius = "5px";
            imgNaipe.style.boxShadow = "0 4px 8px rgba(0,0,0,0.5)";

            bloqueCarta.appendChild(etiquetaRol);
            bloqueCarta.appendChild(imgNaipe);

            const numeroRol = parseInt(data.rol.replace("Jugador ", ""));
            if (numeroRol % 2 === 0) {
                bloqueCarta.style.marginBottom = "20px";
            }

            columnaRonda.appendChild(bloqueCarta);

            if (miRolActual.includes(data.rol)) {
                const imagenes = document.getElementById('mis-cartas-container').getElementsByTagName('img');
                for (let img of imagenes) {
                    if (img.src.includes(`${data.carta.numero}_${data.carta.palo}.png`) && img.style.display !== 'none') {
                        img.style.display = 'none';
                        break;
                    }
                }
            }
        });

        socket.on('cambio_turno_sincro', (data) => {
            const textoEspera = document.getElementById('texto-espera');
            if (textoEspera) {
                textoEspera.style.display = "block";
                textoEspera.innerText = `Turno de juego: ${data.jugador_esperado}`;
            }

            const miRolActual = document.getElementById('mi-rol').innerText;
            if (!miRolActual.includes("Espectador")) {
                const miNumeroJugador = parseInt(miRolActual.replace("Tu Rol actual: Jugador ", ""));
                const miBando = (miNumeroJugador % 2 === 0) ? "Par" : "Impar";
                const bandoDelTurno = (parseInt(data.turno_actual_idx) % 2 === 0) ? "Impar" : "Par";

                const panelTruco = document.getElementById('botonera-truco-ofensiva');
                // Sincronizamos visibilidad estricta por bando de juego
                if (panelTruco.style.display !== 'none' || bandoDelTurno === miBando) {
                    panelTruco.style.display = (miBando === bandoDelTurno) ? 'flex' : 'none';
                }
            }
        });

        socket.on('envido_gritado', (data) => {
            const miRolActual = document.getElementById('mi-rol').innerText;
            if (miRolActual.includes("Espectador")) return;

            document.getElementById('botonera-truco-ofensiva').style.display = 'none';
            document.getElementById('botonera-respuesta-truco').style.display = 'none';

            const numEmisor = parseInt(data.rol.replace("Jugador ", ""));
            const numReceptor = parseInt(miRolActual.replace("Tu Rol actual: Jugador ", ""));

            const bandoEmisorEsPar = (numEmisor % 2 === 0);
            const bandoReceptorEsPar = (numReceptor % 2 === 0);

            if (bandoEmisorEsPar !== bandoReceptorEsPar) {
                const botoneraRespuesta = document.getElementById('botonera-respuesta-envido');
                botoneraRespuesta.style.display = 'flex';

                document.getElementById('btn-revire-envido').style.display = data.opciones.envido ? 'inline-block' : 'none';
                document.getElementById('btn-revire-real').style.display = data.opciones.real_envido ? 'inline-block' : 'none';
                document.getElementById('btn-revire-falta').style.display = data.opciones.falta_envido ? 'inline-block' : 'none';
                
                let msg = data.mensaje_especial ? data.mensaje_especial : `${data.rol} gritó: ${data.tipo.toUpperCase()}. ¡Te toca responder!`;
                alert(msg);
            } else {
                document.getElementById('botonera-envido').style.display = 'none';
            }
        });

        function cantarTantos(tipoGrito) {
            const codigo = document.getElementById('codigo-sala').value.toUpperCase();
            socket.emit('cantar_envido', {
                codigo: codigo,
                tipo: tipoGrito
            });
        }

        function responderTantos(decision) {
            const codigo = document.getElementById('codigo-sala').value.toUpperCase();
            socket.emit('responder_envido', {
                codigo: codigo,
                decision: decision
            });
            document.getElementById('botonera-respuesta-envido').style.display = 'none';
        }

        socket.on('fase_declaracion_iniciada', (data) => {
            alert(data.mensaje);
            evaluarMiTurnoDeAnuncio(data.turno_idx, data.jugador_esperado, 0);
        });

        socket.on('siguiente_turno_declaracion', (data) => {
            evaluarMiTurnoDeAnuncio(data.turno_idx, data.jugador_esperado, data.tanto_maximo_mesa);
        });

        socket.on('tanto_anunciado_sala', (data) => {
            document.getElementById('texto-espera').style.display = 'block';
            document.getElementById('texto-espera').innerText = data.mensaje;
        });

        socket.on('envido_resuelto_quiero', (data) => {
            document.getElementById('botonera-anuncio-tanto').style.display = 'none';
            document.getElementById('texto-espera').style.display = 'none';
            alert(`🏆 ¡FIN DEL ENVIDO!\n\n${data.mensaje}`);
            
            const miRolActual = document.getElementById('mi-rol').innerText;
            if(!miRolActual.includes("Espectador")) {
                document.getElementById('botonera-truco-ofensiva').style.display = 'flex';
            }
        });

        socket.on('envido_resuelto_no_quiero', (data) => {
            document.getElementById('botonera-respuesta-envido').style.display = 'none';
            document.getElementById('texto-espera').style.display = 'none';
            alert(`❌ ENVIDO RECHAZADO\n\n${data.mensaje}`);
            
            const miRolActual = document.getElementById('mi-rol').innerText;
            if(!miRolActual.includes("Espectador")) {
                document.getElementById('botonera-truco-ofensiva').style.display = 'flex';
            }
        });

        function evaluarMiTurnoDeAnuncio(turnoIdxEsperado, stringJugadorEsperado, tantoMaximoMesa) {
            const miRolActual = document.getElementById('mi-rol').innerText;
            if (miRolActual.includes("Espectador")) return;

            const miNumeroJugador = parseInt(miRolActual.replace("Tu Rol actual: Jugador ", ""));
            const idxMiSilla = miNumeroJugador - 1;

            const panelAnuncio = document.getElementById('botonera-anuncio-tanto');
            const btnAnunciar = document.getElementById('btn-anunciar-numero');
            const btnBuenas = document.getElementById('btn-son-buenas');
            
            if (idxMiSilla === parseInt(turnoIdxEsperado)) {
                panelAnuncio.style.display = 'flex';
                document.getElementById('label-tanto-calculado').innerText = `Tus tantos: ${miTantoLocalCalculado}`;
                document.getElementById('texto-espera').innerText = "¡Es tu turno de declarar tus tantos!";
                
                if (parseInt(turnoIdxEsperado) === 0) {
                    btnBuenas.style.display = 'none';
                    btnAnunciar.style.display = 'inline-block';
                    btnAnunciar.innerText = `💬 Cantar ${miTantoLocalCalculado}`;
                } else {
                    btnBuenas.style.display = 'inline-block';
                    let maxActual = parseInt(tantoMaximoMesa || 0);
                    if (miTantoLocalCalculado <= maxActual) {
                        btnAnunciar.style.display = 'none';
                    } else {
                        btnAnunciar.style.display = 'inline-block';
                        btnAnunciar.innerText = `💬 Cantar ${miTantoLocalCalculado}`;
                    }
                }
            } else {
                panelAnuncio.style.display = 'none';
                document.getElementById('texto-espera').style.display = 'block';
                document.getElementById('texto-espera').innerText = `Esperando que ${stringJugadorEsperado} declare...`;
            }
        }

        function enviarDeclaracion(accionElegida) {
            const codigo = document.getElementById('codigo-sala').value.toUpperCase();
            socket.emit('declarar_tanto', {
                codigo: codigo,
                accion: accionElegida,
                tanto: miTantoLocalCalculado
            });
            document.getElementById('botonera-anuncio-tanto').style.display = 'none';
        }

        function gritarTruco(tipoGrito) {
            const codigo = document.getElementById('codigo-sala').value.toUpperCase();
            socket.emit('cantar_truco', {
                codigo: codigo,
                tipo: tipoGrito
            });
            document.getElementById('botonera-respuesta-truco').style.display = 'none';
        }

        function responderTruco(decision) {
            const codigo = document.getElementById('codigo-sala').value.toUpperCase();
            socket.emit('responder_truco', {
                codigo: codigo,
                decision: decision
            });
            // ✅ SINCRO LOCAL: Oculta inmediatamente la botonera en la pantalla que cliqueó
            document.getElementById('botonera-respuesta-truco').style.display = 'none';
        }

        socket.on('truco_gritado', (data) => {
            const miRolActual = document.getElementById('mi-rol').innerText;
            if (miRolActual.includes("Espectador")) return;

            const miNumeroJugador = parseInt(miRolActual.replace("Tu Rol actual: Jugador ", ""));
            const miBando = (miNumeroJugador % 2 === 0) ? "Par" : "Impar";

            if (miBando !== data.bando_emisor) {
                document.getElementById('botonera-truco-ofensiva').style.display = 'none';
                
                const panelRespuesta = document.getElementById('botonera-respuesta-truco');
                panelRespuesta.style.display = 'flex';

                document.getElementById('btn-responder-retruco').style.display = data.opciones.retruco ? 'inline-block' : 'none';
                document.getElementById('btn-responder-vale4').style.display = data.opciones.vale_4 ? 'inline-block' : 'none';
                document.getElementById('btn-envido-primero').style.display = data.opciones.envido_primero ? 'inline-block' : 'none';
                
                let msg = data.mensaje_especial ? data.mensaje_especial : `¡${data.rol} gritó ${data.tipo.toUpperCase()}! ¿Qué hace tu bando?`;
                alert(msg);
            } else {
                document.getElementById('botonera-truco-ofensiva').style.display = 'none';
            }
        });

        socket.on('truco_resuelto', (data) => {
            alert(data.mensaje);
            const miRolActual = document.getElementById('mi-rol').innerText;
            if (miRolActual.includes("Espectador")) return;

            const miNumeroJugador = parseInt(miRolActual.replace("Tu Rol actual: Jugador ", ""));
            const miBando = (miNumeroJugador % 2 === 0) ? "Par" : "Impar";

            // ✅ ARREGLO DE EQUIPO INTERFAZ: Si alguien ya aceptó, ocultamos las botoneras de respuesta a TODOS
            document.getElementById('botonera-respuesta-truco').style.display = 'none';

            // ✅ MUTACIÓN DINÁMICA DE BOTONES: Evaluamos la fase querida real para mutar los botones ofensivos
            const panelTruco = document.getElementById('botonera-truco-ofensiva');
            panelTruco.style.display = 'flex';

            if (data.fase_truco === "truco_querido") {
                document.getElementById('btn-gritar-truco').style.display = 'none';
                document.getElementById('btn-gritar-retruco').style.display = 'inline-block';
                document.getElementById('btn-gritar-vale4').style.display = 'none';
            } else if (data.fase_truco === "retruco_querido") {
                document.getElementById('btn-gritar-truco').style.display = 'none';
                document.getElementById('btn-gritar-retruco').style.display = 'none';
                document.getElementById('btn-gritar-vale4').style.display = 'inline-block';
            } else {
                panelTruco.style.display = 'none';
            }
        });

        socket.on('ronda_finalizada', (data) => {
            alert(`📢 FIN DE RONDA ${data.ronda_numero}\nSe la adjudica el bando: ${data.bando_ganador}`);
        });

        socket.on('mano_finalizada', (data) => {
            document.getElementById('botonera-truco-ofensiva').style.display = 'none';
            document.getElementById('botonera-respuesta-truco').style.display = 'none';
            document.getElementById('botonera-envido').style.display = 'none';
            document.getElementById('botonera-respuesta-envido').style.display = 'none';
            
            document.getElementById('texto-espera').style.display = 'block';
            document.getElementById('texto-espera').innerText = "Mano finalizada. Esperando el reparto del servidor...";
            
            alert(`🏁 MANO CONCLUIDA\n\n${data.mensaje}`);
        });
    </script>
</body>
</html>
