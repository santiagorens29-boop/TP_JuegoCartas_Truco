<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor de Juegos de Cartas - V2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body style="background-color: #1e272e; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; padding: 20px;">

    <h1>♠️ Motor de Juegos de Cartas ♦️</h1>
    <div id="estado-conexion" style="background-color: #3d3d3d; padding: 5px; display: inline-block; border-radius: 5px; margin-bottom: 20px;">
        Conectando al servidor central...
    </div>

    <div id="pantalla-lobby" style="max-width: 400px; margin: 0 auto; background-color: #2f3640; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
        
        <h3>Configuración de la Mesa</h3>
        <input type="text" id="codigo-sala" placeholder="Código de Sala (Ej: TRUCO77)" style="width: 90%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: none; text-transform: uppercase;"><br>

        <label for="select-jugadores">Cantidad de Jugadores:</label>
        <select id="select-jugadores" style="width: 95%; padding: 10px; margin-bottom: 20px; border-radius: 5px; background: #fff; color: #000;">
            <option value="2">2 Jugadores (1 vs 1)</option>
            <option value="4">4 Jugadores (2 vs 2 - Equipos)</option>
            <option value="6">6 Jugadores (3 vs 3 - Equipos)</option>
        </select>

        <button onclick="crearMesa()" style="width: 100%; padding: 12px; background-color: #4cd137; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-bottom: 10px;">
            Crear Nueva Partida
        </button>
        
        <button onclick="unirseAMesa()" style="width: 100%; padding: 12px; background-color: #00a8ff; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">
            Unirse como Jugador / Espectador
        </button>
    </div>

    <div id="pantalla-juego" style="display: none; max-width: 800px; margin: 0 auto; background-color: #0c5c36; border: 8px solid #8c52ff; border-radius: 15px; padding: 20px; min-height: 430px; box-shadow: inset 0 0 50px rgba(0,0,0,0.8);">
        
        <h2 style="color: #fbc531;">Mesa de Juego Activa</h2>
        <div id="info-sala" style="font-weight: bold; margin-bottom: 10px;"></div>
        <div id="mi-rol" style="color: #00a8ff; font-weight: bold; margin-bottom: 20px;"></div>

        <div style="background-color: #0a4b2c; border: 2px dashed #fff; border-radius: 10px; min-height: 240px; margin: 20px 0; display: grid; grid-template-columns: repeat(3, 1fr); padding: 15px; gap: 15px; position: relative;">
            
            <p id="texto-espera" style="color: #a4b0be; font-style: italic; position: absolute; width: 100%; top: 40%; margin: 0; left: 0; pointer-events: none;">
                Esperando que los jugadores tiren sus cartas...
            </p>

            <div id="ronda-1" style="display: flex; flex-direction: column-reverse; align-items: center; gap: 15px; justify-content: flex-end; border-right: 1px dashed rgba(255,255,255,0.2); padding-right: 5px;"></div>
            
            <div id="ronda-2" style="display: flex; flex-direction: column-reverse; align-items: center; gap: 15px; justify-content: flex-end; border-right: 1px dashed rgba(255,255,255,0.2); padding-right: 5px;"></div>
            
            <div id="ronda-3" style="display: flex; flex-direction: column-reverse; align-items: center; gap: 15px; justify-content: flex-end;"></div>
        </div>

        <div style="background-color: #2f3640; padding: 15px; border-radius: 10px;">
            <div id="botonera-envido" style="margin-bottom: 15px; display: none; justify-content: center; gap: 10px;">
                <button onclick="cantarTantos('envido')" style="padding: 10px 15px; background-color: #fbc531; color: black; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">
                    📢 Envido
                </button>
                <button onclick="cantarTantos('real_envido')" style="padding: 10px 15px; background-color: #e67e22; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">
                    🔥 Real Envido
                </button>
                <button onclick="cantarTantos('falta_envido')" style="padding: 10px 15px; background-color: #e74c3c; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">
                    🚨 Falta Envido
                </button>
            </div>

            <h4>Tus Cartas en Mano:</h4>
            <div id="mis-cartas-container" style="display: flex; justify-content: center; gap: 15px;">
            </div>
        </div>
    </div>

    <script>
        const socket = io();

        socket.on('connect', () => {
            const estado = document.getElementById('estado-conexion');
            estado.innerText = "Conectado al Servidor Central (Intranet)";
            estado.style.backgroundColor = "#4cd137";
        });

        function crearMesa() {
            const codigo = document.getElementById('codigo-sala').value;
            const maxJugadores = document.getElementById('select-jugadores').value;
            if(!codigo) { alert("Ingresá un código de sala."); return; }
            socket.emit('crear_sala', { codigo: codigo, max_jugadores: maxJugadores });
        }

        function unirseAMesa() {
            const codigo = document.getElementById('codigo-sala').value;
            if(!codigo) { alert("Ingresá un código de sala."); return; }
            socket.emit('unirse_sala', { codigo: codigo });
        }

        socket.on('sala_creada', (data) => {
            alert(data.mensaje);
            abrirMesaDeJuego(data.rol);
        });

        socket.on('rol_asignado', (data) => {
            abrirMesaDeJuego(data.rol);
            if(data.mensaje) { alert(data.mensaje); }
        });

        socket.on('partida_lista', (data) => {
            alert(data.mensaje);
            document.getElementById('texto-espera').innerText = "¡La partida comenzó! Turno del Jugador 1...";
        });

        socket.on('error', (data) => {
            alert(data.mensaje);
        });

        function abrirMesaDeJuego(rolAsignado) {
            const codigo = document.getElementById('codigo-sala').value.toUpperCase();
            document.getElementById('pantalla-lobby').style.display = 'none';
            document.getElementById('pantalla-juego').style.display = 'block';
            document.getElementById('info-sala').innerText = `SALA: ${codigo}`;
            document.getElementById('mi-rol').innerText = `Tu Rol actual: ${rolAsignado}`;
        }

        socket.on('recibir_cartas', (data) => {
            const contenedor = document.getElementById('mis-cartas-container');
            contenedor.innerHTML = ""; 

            // ✅ CORREGIDO (DETALLE 1): Validación estricta por paridad de equipos para 2, 4 o 6 jugadores
            const miRolActual = document.getElementById('mi-rol').innerText; // Ejemplo: "Tu Rol actual: Jugador 3"
            const totalJugadores = parseInt(document.getElementById('select-jugadores').value);
            const miNumeroJugador = parseInt(miRolActual.replace("Tu Rol actual: Jugador ", ""));

            let puedeCantar = false;
            if (totalJugadores === 2) {
                puedeCantar = true; // En 1 vs 1 cantan ambos sin restricciones
            } else if (totalJugadores === 4) {
                if (miNumeroJugador === 3 || miNumeroJugador === 4) puedeCantar = true;
            } else if (totalJugadores === 6) {
                if (miNumeroJugador === 5 || miNumeroJugador === 6) puedeCantar = true;
            }

            if (puedeCantar) {
                document.getElementById('botonera-envido').style.display = 'flex';
            } else {
                document.getElementById('botonera-envido').style.display = 'none';
            }

            data.cartas.forEach((carta, indice) => {
                const imagenCarta = document.createElement('img');
                imagenCarta.src = `static/cartas/${carta.numero}_${carta.palo}.png`;
                imagenCarta.id = `carta-${indice}`;
                
                imagenCarta.style.width = "100px";
                imagenCarta.style.height = "auto";
                imagenCarta.style.borderRadius = "8px";
                imagenCarta.style.cursor = "pointer";
                imagenCarta.style.boxShadow = "0 6px 10px rgba(0,0,0,0.4)";
                imagenCarta.style.transition = "transform 0.2s";

                imagenCarta.onmouseover = () => { imagenCarta.style.transform = "scale(1.08)"; };
                imagenCarta.onmouseout = () => { imagenCarta.style.transform = "scale(1)"; };

                imagenCarta.onclick = () => {
                    const codigo = document.getElementById('codigo-sala').value.toUpperCase();
                    socket.emit('tirar_carta', {
                        codigo: codigo,
                        carta: carta
                    });
                };
                contenedor.appendChild(imagenCarta);
            });
        });

        socket.on('carta_jugada', (data) => {
            if (data.ronda > 1) {
                document.getElementById('botonera-envido').style.display = 'none';
            }

            const textoEspera = document.getElementById('texto-espera');
            if (textoEspera) { textoEspera.style.display = "none"; }
            
            const columnaRonda = document.getElementById(`ronda-${data.ronda}`);
            if (!columnaRonda) return;

            const bloqueCarta = document.createElement('div');
            bloqueCarta.style.display = "flex";
            bloqueCarta.style.flexDirection = "column";
            bloqueCarta.style.alignItems = "center";
            bloqueCarta.style.gap = "3px";

            const etiquetaRol = document.createElement('p');
            etiquetaRol.innerText = data.rol;
            etiquetaRol.style.margin = "0";
            etiquetaRol.style.fontSize = "12px";
            etiquetaRol.style.fontWeight = "bold";
            etiquetaRol.style.color = "#fbc531";

            const imgNaipe = document.createElement('img');
            imgNaipe.src = `static/cartas/${data.carta.numero}_${data.carta.palo}.png`;
            imgNaipe.style.width = "75px";
            imgNaipe.style.height = "auto";
            imgNaipe.style.borderRadius = "5px";
            imgNaipe.style.boxShadow = "0 4px 8px rgba(0,0,0,0.5)";

            bloqueCarta.appendChild(etiquetaRol);
            bloqueCarta.appendChild(imgNaipe);

            const numeroRol = parseInt(data.rol.replace("Jugador ", ""));
            if (numeroRol % 2 === 0) {
                bloqueCarta.style.marginBottom = "20px";
            }

            columnaRonda.appendChild(bloqueCarta);

            const miRolActual = document.getElementById('mi-rol').innerText;
            if (miRolActual.includes(data.rol)) {
                const imagenes = document.getElementById('mis-cartas-container').getElementsByTagName('img');
                for (let img of imagenes) {
                    if (img.src.includes(`${data.carta.numero}_${data.carta.palo}.png`) && img.style.display !== 'none') {
                        img.style.display = 'none';
                        break;
                    }
                }
            }
        });

        function cantarTantos(tipoGrito) {
            const codigo = document.getElementById('codigo-sala').value.toUpperCase();
            socket.emit('cantar_envido', {
                codigo: codigo,
                tipo: tipoGrito
            });
        }
    </script>
</body>
</html>
